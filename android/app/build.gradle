apply plugin: 'com.android.application'

android {
    namespace "com.arriveoclock.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.arriveoclock.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // FIXED debug key (committed; debug keys aren't secret). Without this,
        // each CI machine auto-generates a different debug.keystore, so a new
        // debug APK won't install over an older one ("App not installed" —
        // signature mismatch) and the device keeps running the OLD build.
        debug {
            storeFile file('aoc-debug.keystore')
            storePassword 'android'
            keyAlias 'aocdebug'
            keyPassword 'android'
        }
        release {
            // Credentials come from env vars / -P gradle properties in CI
            // (see codemagic.yaml). Guarded so local/debug builds without a
            // keystore still configure cleanly.
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: project.findProperty("ANDROID_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: project.findProperty("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: project.findProperty("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: project.findProperty("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign the release only when keystore creds are supplied (Play builds).
            if (System.getenv("ANDROID_KEYSTORE_PATH") ?: project.findProperty("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// ---------------------------------------------------------------------------
// CI-robust web asset sync. Some pipelines run `npx cap sync` AFTER the Gradle
// build, so the APK gets packaged with the PREVIOUS build's web assets (stale
// JS). This guarantees the freshly-built Vite output (repo dist/) is copied
// into the APK assets immediately before packaging — regardless of when, or
// whether, cap sync runs.
def webDistDir = new File(rootProject.projectDir, "../dist")
def webAssetsDir = new File(projectDir, "src/main/assets/public")
tasks.register('syncWebAssets') {
    doLast {
        if (webDistDir.exists()) {
            delete webAssetsDir
            copy {
                from webDistDir
                into webAssetsDir
            }
            println "syncWebAssets: copied ${webDistDir} -> ${webAssetsDir}"
        } else {
            println "syncWebAssets: ${webDistDir} not found — leaving existing assets in place"
        }
        // Also keep the Capacitor runtime config fresh (so useLegacyBridge etc.
        // ship even if cap sync ran before/after at the wrong time).
        def cfgSrc = new File(rootProject.projectDir, "../capacitor.config.json")
        if (cfgSrc.exists()) {
            copy {
                from cfgSrc
                into new File(projectDir, "src/main/assets")
            }
        }
    }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'syncWebAssets' }

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
