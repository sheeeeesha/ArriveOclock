# Capacitor 8's modules compile with sourceCompatibility 21, which passes
# `-source 21` to the JVM running Gradle itself (a toolchain block would not be
# consulted). So the DAEMON must be Java 21, not just the compile toolchain.
# Declaring the criterion here lets Gradle resolve/provision a matching JVM via
# the foojay resolver in settings.gradle, instead of every machine needing a
# JDK 21 pre-installed and selected.
toolchainVersion=21
