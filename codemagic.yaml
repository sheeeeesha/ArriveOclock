# Codemagic CI — build the ArriveO'Clock Android app in the cloud (no Android
# Studio needed locally). Connect this repo at codemagic.io, pick the
# "android-debug" workflow, run it, then download + sideload the APK.
#
# Debug APK is auto-signed with a debug key → installable on your own phone
# (enable "install unknown apps"). For a Play Store release you'd add a release
# workflow with a signing keystore configured in Codemagic.

workflows:
  android-debug:
    name: ArriveO'Clock Android (debug)
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        # Create a variable group named "supabase" in Codemagic with:
        #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        # Vite reads VITE_-prefixed env vars at build time.
        - supabase
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Clean stale build artifacts
        script: rm -rf dist node_modules/.vite android/app/src/main/assets/public
      - name: Build web (Vite)
        script: npm run build
      - name: Capacitor sync → Android
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    # The built APK appears under "Artifacts" on the build page — download it
    # there. To also get it by email, add a publishing.email block (see
    # docs.codemagic.io).

  # ---------------------------------------------------------------------------
  # Release workflow → Android App Bundle (.aab) for the Play Store.
  #
  # To produce a SIGNED, uploadable .aab, add these as SECURE environment
  # variables in Codemagic (project settings → Environment variables — no named
  # group required):
  #   ANDROID_KEYSTORE_BASE64    base64 of your upload .jks  (base64 -w0 file.jks)
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  # If they're absent, this workflow still runs and builds an UNSIGNED .aab
  # (fine for inspection, NOT uploadable to Play). Keep the .jks + passwords
  # backed up — losing them means you can never update the app.
  # ---------------------------------------------------------------------------
  android-release:
    name: ArriveO'Clock Android (release AAB)
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        - supabase        # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Clean stale build artifacts
        script: rm -rf dist node_modules/.vite android/app/src/main/assets/public
      - name: Build web (Vite)
        script: npm run build
      - name: Capacitor sync → Android
        script: npx cap sync android
      - name: Build release AAB (signed if keystore present)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/upload.jks"
            ./gradlew bundleRelease \
              -PANDROID_KEYSTORE_PATH="$CM_BUILD_DIR/upload.jks" \
              -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "WARNING: no ANDROID_KEYSTORE_BASE64 set — building UNSIGNED release."
            ./gradlew bundleRelease
          fi
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    # Download the .aab from "Artifacts" and upload it to the Play Console, or
    # wire automatic publishing with a publishing.google_play block + a
    # service-account JSON (docs.codemagic.io/yaml-publishing/google-play).

  # ---------------------------------------------------------------------------
  # iOS build. Runs on a Mac (required for Xcode). Two modes:
  #
  #  • SIGNED (App Store / TestFlight / device): set up code signing in
  #    Codemagic — add the App Store Connect integration, then create an
  #    environment group named "ios_signing" and enable automatic code signing
  #    (Codemagic → your app → Settings → Code signing identities). With signing
  #    present this archives a real, installable .ipa.
  #  • COMPILE-CHECK (no Apple account yet): with no signing configured it still
  #    builds with CODE_SIGNING_ALLOWED=NO to prove the native code + plugins
  #    compile. That output is NOT installable — iOS requires signing to run on a
  #    device — but it validates the whole app end to end in CI.
  #
  # A physical iPhone + an Apple Developer account ($99/yr) is unavoidable to run
  # on a real device; there is no debug-sideload shortcut like Android's.
  # ---------------------------------------------------------------------------
  ios:
    name: ArriveO'Clock iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - supabase        # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.arriveoclock.app"
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Clean stale build artifacts
        script: rm -rf dist node_modules/.vite ios/App/App/public
      - name: Build web (Vite)
        script: npm run build
      - name: Capacitor sync → iOS
        script: npx cap sync ios
      - name: Ensure the native Alarm plugin stays registered
        # cap sync regenerates packageClassList from npm packages only, dropping
        # our app-local AlarmPlugin — re-add it so the "Alarm" JS plugin resolves.
        script: |
          node -e "const fs=require('fs');const f='ios/App/App/capacitor.config.json';const c=JSON.parse(fs.readFileSync(f));c.packageClassList=c.packageClassList||[];if(!c.packageClassList.includes('AlarmPlugin')){c.packageClassList.push('AlarmPlugin');fs.writeFileSync(f,JSON.stringify(c,null,2));}console.log('packageClassList:',c.packageClassList);"
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install
      - name: Set up code signing (if configured)
        script: |
          if [ -n "$CM_CERTIFICATE" ] || xcode-project use-profiles 2>/dev/null; then
            echo "Signing profiles available."
          else
            echo "No signing set up — will build unsigned (compile check only)."
          fi
      - name: Build iOS app
        script: |
          set -e
          if xcode-project use-profiles >/dev/null 2>&1 && ls $HOME/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision >/dev/null 2>&1; then
            echo "Signing present → archiving a distributable .ipa"
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
          else
            echo "No signing → compile-only build to validate the code"
            xcodebuild \
              -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Debug \
              -sdk iphoneos \
              -destination generic/platform=iOS \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # A produced .ipa (signed mode) can be published to TestFlight with a
    # publishing.app_store_connect block (docs.codemagic.io/yaml-publishing/app-store-connect).
