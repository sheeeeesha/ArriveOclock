# Codemagic CI — build the ArriveO'Clock Android app in the cloud (no Android
# Studio needed locally). Connect this repo at codemagic.io, pick the
# "android-debug" workflow, run it, then download + sideload the APK.
#
# Debug APK is auto-signed with a debug key → installable on your own phone
# (enable "install unknown apps"). For a Play Store release you'd add a release
# workflow with a signing keystore configured in Codemagic.

workflows:
  android-debug:
    name: ArriveO'Clock Android (debug)
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        # Create a variable group named "supabase" in Codemagic with:
        #   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
        # Vite reads VITE_-prefixed env vars at build time.
        - supabase
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Clean stale build artifacts
        script: rm -rf dist node_modules/.vite android/app/src/main/assets/public
      - name: Build web (Vite)
        script: npm run build
      - name: Capacitor sync → Android
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    # The built APK appears under "Artifacts" on the build page — download it
    # there. To also get it by email, add a publishing.email block (see
    # docs.codemagic.io).

  # ---------------------------------------------------------------------------
  # Release workflow → Android App Bundle (.aab) for the Play Store.
  #
  # To produce a SIGNED, uploadable .aab, add these as SECURE environment
  # variables in Codemagic (project settings → Environment variables — no named
  # group required):
  #   ANDROID_KEYSTORE_BASE64    base64 of your upload .jks  (base64 -w0 file.jks)
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  # If they're absent, this workflow still runs and builds an UNSIGNED .aab
  # (fine for inspection, NOT uploadable to Play). Keep the .jks + passwords
  # backed up — losing them means you can never update the app.
  # ---------------------------------------------------------------------------
  android-release:
    name: ArriveO'Clock Android (release AAB)
    max_build_duration: 60
    environment:
      node: 20
      java: 17
      groups:
        - supabase        # VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Clean stale build artifacts
        script: rm -rf dist node_modules/.vite android/app/src/main/assets/public
      - name: Build web (Vite)
        script: npm run build
      - name: Capacitor sync → Android
        script: npx cap sync android
      - name: Build release AAB (signed if keystore present)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/upload.jks"
            ./gradlew bundleRelease \
              -PANDROID_KEYSTORE_PATH="$CM_BUILD_DIR/upload.jks" \
              -PANDROID_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
              -PANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
              -PANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            echo "WARNING: no ANDROID_KEYSTORE_BASE64 set — building UNSIGNED release."
            ./gradlew bundleRelease
          fi
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
    # Download the .aab from "Artifacts" and upload it to the Play Console, or
    # wire automatic publishing with a publishing.google_play block + a
    # service-account JSON (docs.codemagic.io/yaml-publishing/google-play).
